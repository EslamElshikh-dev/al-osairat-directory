name: Temporary GA4 Lighthouse comparison

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remember refs
        run: |
          echo "CANDIDATE_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          git fetch origin main

      - name: Install Lighthouse
        run: npm install --global lighthouse@12.8.2

      - name: Measure baseline main
        run: |
          set -euo pipefail
          git checkout --force origin/main
          git clean -fdx
          npm ci
          npm run build
          node ./node_modules/next/dist/bin/next start -p 3000 > /tmp/osairat-main.log 2>&1 &
          SERVER_PID=$!
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          lighthouse http://127.0.0.1:3000/ --output=json --output-path=/tmp/lh-main.json --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo
          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true
          for i in {1..20}; do ! curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1 && break; sleep 0.25; done
          if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then echo 'Baseline server still alive'; exit 1; fi

      - name: Measure GA4 candidate
        run: |
          set -euo pipefail
          git checkout --force "$CANDIDATE_SHA"
          git clean -fdx
          npm ci
          npm run build
          node ./node_modules/next/dist/bin/next start -p 3000 > /tmp/osairat-candidate.log 2>&1 &
          SERVER_PID=$!
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          lighthouse http://127.0.0.1:3000/ --output=json --output-path=/tmp/lh-candidate.json --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo
          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true

      - name: Print focused diagnostics
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const pick = lhr => {
            const a = lhr.audits;
            return {
              scores: Object.fromEntries(['performance','accessibility','best-practices','seo'].map(k => [k, Math.round((lhr.categories[k].score || 0) * 100)])),
              metrics: {
                fcpMs: Math.round(a['first-contentful-paint']?.numericValue || 0),
                lcpMs: Math.round(a['largest-contentful-paint']?.numericValue || 0),
                tbtMs: Math.round(a['total-blocking-time']?.numericValue || 0),
                cls: a['cumulative-layout-shift']?.numericValue ?? null,
                mainThreadMs: Math.round(a['mainthread-work-breakdown']?.numericValue || 0),
                jsExecutionMs: Math.round(a['bootup-time']?.numericValue || 0),
              },
              googleRequests: (a['network-requests']?.details?.items || [])
                .filter(x => /google(tagmanager|-analytics)|analytics\.google/i.test(String(x.url || '')))
                .map(x => ({ url: x.url, statusCode: x.statusCode, transferSize: x.transferSize, resourceType: x.resourceType })),
              consoleErrors: a['errors-in-console']?.details?.items || [],
            };
          };
          console.log('[FOCUSED_DIAGNOSTICS]');
          console.log(JSON.stringify({ baseline: pick(read('/tmp/lh-main.json')), candidate: pick(read('/tmp/lh-candidate.json')) }, null, 2));
          NODE

      - name: Verify deferred GA4 delivery in Chromium
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          node ./node_modules/next/dist/bin/next start -p 3000 > /tmp/osairat-ga4-browser.log 2>&1 &
          SERVER_PID=$!
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done

          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          const isTag = url => url.includes('googletagmanager.com/gtag/js');
          const isCollect = url => url.includes('google-analytics.com/g/collect') || url.includes('analytics.google.com/g/collect');
          const recordRequest = request => ({ url: request.url(), method: request.method(), postData: request.postData() || '' });
          const hasEvent = (record, name) => {
            if (!record) return false;
            try {
              if (new URL(record.url).searchParams.get('en') === name) return true;
            } catch {}
            const body = String(record.postData || '');
            let decoded = body;
            try { decoded = decodeURIComponent(body); } catch {}
            return body.includes(`en=${name}`) || body.includes(`en%3D${name}`) || decoded.includes(`en=${name}`);
          };

          (async () => {
            const browser = await puppeteer.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            try {
              const delayedPage = await browser.newPage();
              const delayedRequests = [];
              const delayedResponses = [];
              const delayedErrors = [];
              delayedPage.on('request', request => {
                const rec = recordRequest(request);
                if (isTag(rec.url) || isCollect(rec.url)) delayedRequests.push(rec);
              });
              delayedPage.on('response', response => {
                const rec = recordRequest(response.request());
                if (isCollect(rec.url)) delayedResponses.push({ request: rec, status: response.status() });
              });
              delayedPage.on('console', msg => { if (msg.type() === 'error') delayedErrors.push(msg.text()); });

              await delayedPage.goto('http://127.0.0.1:3000/', { waitUntil: 'load' });
              await wait(1200);
              const earlyTagCount = delayedRequests.filter(r => isTag(r.url)).length;
              if (earlyTagCount !== 0) throw new Error(`GA4 loaded too early: ${earlyTagCount}`);
              await wait(7000);

              const delayedTag = delayedRequests.some(r => isTag(r.url));
              const delayedPageViewRequest = delayedRequests.some(r => isCollect(r.url) && hasEvent(r, 'page_view'));
              const delayedPageView204 = delayedResponses.some(r => hasEvent(r.request, 'page_view') && r.status === 204);
              if (!delayedTag) throw new Error('Deferred GA4 tag never loaded');
              if (!delayedPageViewRequest) throw new Error('Deferred GA4 page_view request was not emitted');
              if (!delayedPageView204) throw new Error('Deferred GA4 page_view did not receive HTTP 204');

              const queuedPage = await browser.newPage();
              const queuedRequests = [];
              const queuedResponses = [];
              const queuedErrors = [];
              queuedPage.on('request', request => {
                const rec = recordRequest(request);
                if (isTag(rec.url) || isCollect(rec.url)) queuedRequests.push(rec);
              });
              queuedPage.on('response', response => {
                const rec = recordRequest(response.request());
                if (isCollect(rec.url)) queuedResponses.push({ request: rec, status: response.status() });
              });
              queuedPage.on('console', msg => { if (msg.type() === 'error') queuedErrors.push(msg.text()); });

              await queuedPage.goto('http://127.0.0.1:3000/', { waitUntil: 'load' });
              await queuedPage.waitForFunction(() => typeof window.gtag === 'function');
              await wait(300);
              if (queuedRequests.some(r => isTag(r.url))) throw new Error('GA4 loaded before queued-event test');

              await queuedPage.evaluate(() => {
                window.__gaPhoneProbeCallback = false;
                window.gtag?.('event', 'phone_click', {
                  test_scope: 'deferred-ga4',
                  event_timeout: 3000,
                  event_callback: () => { window.__gaPhoneProbeCallback = true; },
                });
              });

              const queuedBeforeInteraction = await queuedPage.evaluate(() =>
                Array.isArray(window.dataLayer) && window.dataLayer.some(item => item && item[0] === 'event' && item[1] === 'phone_click')
              );
              if (!queuedBeforeInteraction) throw new Error('phone_click was not present in dataLayer before interaction');

              await queuedPage.evaluate(() => {
                window.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
              });
              await wait(5000);

              const interactionTag = queuedRequests.some(r => isTag(r.url));
              const queuedPhoneRequest = queuedRequests.some(r => isCollect(r.url) && hasEvent(r, 'phone_click'));
              const queuedPhone204 = queuedResponses.some(r => hasEvent(r.request, 'phone_click') && r.status === 204);
              const eventCallbackFired = await queuedPage.evaluate(() => Boolean(window.__gaPhoneProbeCallback));

              console.log('[GA4_QUEUE_DEBUG]', JSON.stringify({ queuedBeforeInteraction, queuedRequests, queuedResponses, queuedErrors, eventCallbackFired }));
              if (!interactionTag) throw new Error('First interaction did not trigger GA4 loading');
              if (!queuedPhoneRequest) throw new Error('Queued phone_click was not emitted after GA4 loaded');
              if (!queuedPhone204) throw new Error('Queued phone_click did not receive HTTP 204');
              if (!eventCallbackFired) throw new Error('Queued phone_click event_callback did not fire');

              console.log('[GA4_BROWSER_VERIFICATION]', JSON.stringify({
                earlyTagCount,
                delayedTag,
                delayedPageViewRequest,
                delayedPageView204,
                queuedBeforeInteraction,
                interactionTag,
                queuedPhoneRequest,
                queuedPhone204,
                eventCallbackFired,
              }));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true
