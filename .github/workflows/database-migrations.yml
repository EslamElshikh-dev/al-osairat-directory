name: Database migration replay

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/database-replay.test.mjs'
      - 'tests/helpers/supabase-postgres.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/database-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'tests/database-replay.test.mjs'
      - 'tests/helpers/supabase-postgres.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/database-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:database
