<!doctype html>
<html lang="ar-EG" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#102a24">
  <title>الاتصال انقطع | دليل العسيرات</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100dvh; display: grid; place-items: center; margin: 0; padding: 24px; color: #183d31; background: #f6f3e9; font-family: system-ui, sans-serif; text-align: center; }
    main { width: min(100%, 430px); padding: 36px 26px; border: 1px solid #dce4d8; border-radius: 24px; background: #fffef9; box-shadow: 0 16px 42px #183d3115; }
    img { width: 76px; height: 76px; border-radius: 18px; }
    h1 { margin: 20px 0 10px; font-size: clamp(1.5rem, 5vw, 2rem); }
    p { margin: 0; color: #53685c; line-height: 1.9; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 25px; padding: 10px 22px; border-radius: 12px; background: #174e3b; color: #fff; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #b88639; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/app-icons/icon-192.png" width="76" height="76" alt="">
    <h1>النت فصل شوية</h1>
    <p>وصّل الإنترنت وجرّب تاني عشان تشوف أحدث الخدمات والأخبار في دليل العسيرات.</p>
    <a href="/">جرّب تفتح الدليل تاني</a>
  </main>
</body>
</html>
