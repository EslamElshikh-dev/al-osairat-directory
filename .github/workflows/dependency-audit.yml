name: Dependency audit

on:
  push:
    branches:
      - fix/security-seo-search-hardening-2026-08-30
    paths:
      - .github/workflows/dependency-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-seo-search-hardening-2026-08-30
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply safe audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify audits
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-production.json || true
          npm audit --json > audit-full.json || true
      - name: Commit lockfile and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json audit-production.json audit-full.json
          git commit -m "chore: apply safe dependency audit fixes" || exit 0
          git push origin HEAD:fix/security-seo-search-hardening-2026-08-30
