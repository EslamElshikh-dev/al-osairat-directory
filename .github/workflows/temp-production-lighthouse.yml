name: Temporary production Lighthouse measurement

on:
  push:
    branches:
      - perf/defer-ga4-without-losing-events

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Lighthouse
        run: npm install --global lighthouse@12.8.2

      - name: Run three mobile production measurements
        run: |
          set -euo pipefail
          TARGET='https://al-osairat-directory.vercel.app/'
          for i in 1 2 3; do
            lighthouse "$TARGET" \
              --output=json \
              --output-path="/tmp/lh-prod-$i.json" \
              --quiet \
              --chrome-flags="--headless --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo
            sleep 3
          done

      - name: Print production median
        run: |
          node <<'NODE'
          const fs = require('fs');
          const runs = [1,2,3].map(i => JSON.parse(fs.readFileSync(`/tmp/lh-prod-${i}.json`, 'utf8')));
          const one = (lhr, index) => {
            const a = lhr.audits;
            const requests = a['network-requests']?.details?.items || [];
            return {
              run: index + 1,
              performance: Math.round((lhr.categories.performance.score || 0) * 100),
              accessibility: Math.round((lhr.categories.accessibility.score || 0) * 100),
              bestPractices: Math.round((lhr.categories['best-practices'].score || 0) * 100),
              seo: Math.round((lhr.categories.seo.score || 0) * 100),
              fcpMs: Math.round(a['first-contentful-paint']?.numericValue || 0),
              lcpMs: Math.round(a['largest-contentful-paint']?.numericValue || 0),
              tbtMs: Math.round(a['total-blocking-time']?.numericValue || 0),
              cls: a['cumulative-layout-shift']?.numericValue ?? null,
              speedIndexMs: Math.round(a['speed-index']?.numericValue || 0),
              mainThreadMs: Math.round(a['mainthread-work-breakdown']?.numericValue || 0),
              jsExecutionMs: Math.round(a['bootup-time']?.numericValue || 0),
              totalBytes: Math.round(a['total-byte-weight']?.numericValue || 0),
              gaTagRequestsInAuditWindow: requests.filter(x => String(x.url || '').includes('googletagmanager.com/gtag/js')).length,
              consoleErrors: a['errors-in-console']?.details?.items?.length || 0,
            };
          };
          const results = runs.map(one);
          const sorted = [...results].sort((x,y) => x.performance - y.performance);
          const median = sorted[1];
          console.log('[PRODUCTION_LIGHTHOUSE_3_RUNS]');
          console.log(JSON.stringify({ results, medianByPerformance: median }, null, 2));
          NODE
