name: Temporary GA4 Lighthouse comparison

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remember refs
        run: |
          echo "CANDIDATE_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          git fetch origin main

      - name: Install Lighthouse
        run: npm install --global lighthouse@12.8.2

      - name: Measure baseline main
        run: |
          set -euo pipefail
          git checkout --force origin/main
          git clean -fdx
          echo "Measuring main: $(git rev-parse HEAD)"
          npm ci
          npm run build
          node ./node_modules/next/dist/bin/next start -p 3000 > /tmp/osairat-main.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > /tmp/osairat-main.pid
          READY=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/osairat-main.log; exit 1; fi
          lighthouse http://127.0.0.1:3000/ \
            --output=json \
            --output-path=/tmp/lh-main.json \
            --quiet \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo
          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true
          for i in {1..20}; do
            if ! curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1; then break; fi
            sleep 0.25
          done
          if curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1; then echo 'Baseline server still alive'; exit 1; fi

      - name: Measure GA4 candidate
        run: |
          set -euo pipefail
          git checkout --force "$CANDIDATE_SHA"
          git clean -fdx
          echo "Measuring candidate: $(git rev-parse HEAD)"
          npm ci
          npm run build
          node ./node_modules/next/dist/bin/next start -p 3000 > /tmp/osairat-candidate.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > /tmp/osairat-candidate.pid
          READY=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/osairat-candidate.log; exit 1; fi
          lighthouse http://127.0.0.1:3000/ \
            --output=json \
            --output-path=/tmp/lh-candidate.json \
            --quiet \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo
          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true

      - name: Print focused diagnostics
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const categoryFailures = (lhr, categoryId) => {
            const category = lhr.categories[categoryId];
            if (!category) return [];
            return category.auditRefs
              .filter((ref) => ref.weight > 0)
              .map((ref) => ({ ref, audit: lhr.audits[ref.id] }))
              .filter(({ audit }) => audit && audit.score !== null && audit.score < 1)
              .map(({ ref, audit }) => ({ id: ref.id, score: audit.score, title: audit.title }));
          };
          const pick = (lhr) => {
            const a = lhr.audits;
            const requests = a['network-requests']?.details?.items || [];
            const googleRequests = requests
              .filter((item) => /google(tagmanager|-analytics)|analytics\.google/i.test(String(item.url || '')))
              .map((item) => ({
                url: item.url,
                statusCode: item.statusCode,
                transferSize: item.transferSize,
                resourceType: item.resourceType,
                startTime: item.networkRequestTime,
                endTime: item.networkEndTime,
              }));
            return {
              scores: {
                performance: Math.round((lhr.categories.performance.score || 0) * 100),
                accessibility: Math.round((lhr.categories.accessibility.score || 0) * 100),
                bestPractices: Math.round((lhr.categories['best-practices'].score || 0) * 100),
                seo: Math.round((lhr.categories.seo.score || 0) * 100),
              },
              metrics: {
                fcpMs: Math.round(a['first-contentful-paint']?.numericValue || 0),
                lcpMs: Math.round(a['largest-contentful-paint']?.numericValue || 0),
                tbtMs: Math.round(a['total-blocking-time']?.numericValue || 0),
                cls: a['cumulative-layout-shift']?.numericValue ?? null,
                speedIndexMs: Math.round(a['speed-index']?.numericValue || 0),
                totalBytes: Math.round(a['total-byte-weight']?.numericValue || 0),
                mainThreadMs: Math.round(a['mainthread-work-breakdown']?.numericValue || 0),
                jsExecutionMs: Math.round(a['bootup-time']?.numericValue || 0),
              },
              googleRequests,
              consoleErrors: a['errors-in-console']?.details?.items || [],
              accessibilityFailures: categoryFailures(lhr, 'accessibility'),
              bestPracticeFailures: categoryFailures(lhr, 'best-practices'),
            };
          };
          const baseline = pick(read('/tmp/lh-main.json'));
          const candidate = pick(read('/tmp/lh-candidate.json'));
          console.log('[FOCUSED_DIAGNOSTICS]');
          console.log(JSON.stringify({ baseline, candidate }, null, 2));
          NODE
